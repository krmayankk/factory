name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Unit tests
        run: python3 -m unittest discover -s tests -v

      - name: Workflow policy (pinned actions, no pull_request_target, explicit permissions)
        run: python3 scripts/check_workflows.py .github/workflows template/.github/workflows

      - name: actionlint (pinned release, checksum-verified)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download v1.7.12 -R rhysd/actionlint -p actionlint_1.7.12_linux_amd64.tar.gz
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  actionlint_1.7.12_linux_amd64.tar.gz" | sha256sum -c -
          tar -xzf actionlint_1.7.12_linux_amd64.tar.gz actionlint
          ./actionlint -color .github/workflows/*.yml template/.github/workflows/*.yml

      - name: shellcheck
        run: shellcheck scripts/*.sh

      - name: Validate every idea
        run: python3 scripts/idea.py validate

      - name: Added ideas must not collide with existing repositories
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          OWNER: ${{ vars.PROJECTS_OWNER }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: python3 scripts/idea.py check-available --base "$BASE" --head "$HEAD" --owner "$OWNER"
