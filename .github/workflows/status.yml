name: status

# The factory status page: every project, its stage, play link and CI — published to
# this repository's GitHub Pages. Reads public data only.
on:
  push:
    branches: [main]
  schedule:
    - cron: "17 * * * *"
  workflow_run:
    workflows: [create-project]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: status
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build the page
        env:
          GH_TOKEN: ${{ github.token }}
          OWNER: ${{ vars.PROJECTS_OWNER }}
        run: python3 scripts/status.py --owner "$OWNER" --out _site
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    # id-token is GitHub Pages' own deployment login — it grants nothing outside Pages.
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
